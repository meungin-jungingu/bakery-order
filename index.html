<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>빵집 발주</title><style>
:root{--bg:#F7F7F5;--card:#FFFFFF;--text:#1F1F1F;--main:#2F6FEB;--highlight:#FFE8A3;--on-main:white;color-scheme:light}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,'맑은 고딕',sans-serif}button,input,select,textarea{font:inherit;color:inherit}button{cursor:pointer;min-height:44px;border:1px solid color-mix(in srgb,var(--text) 18%,transparent);background:var(--card);border-radius:12px;padding:10px 14px;touch-action:manipulation;transition:transform .12s}button:active{transform:scale(.95)}button:disabled{opacity:.35;cursor:default}button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--main);outline-offset:2px}.primary{background:var(--main);color:var(--on-main);border-color:transparent;font-weight:750}.muted{opacity:.72}.small{font-size:13px}h1{font-size:29px;letter-spacing:-1px;line-height:1.25;margin:10px 0}h2{font-size:18px;margin:0 0 12px}h3{font-size:14px;margin:24px 0 9px}p{margin:8px 0 20px}.eyebrow{font-size:12px;font-weight:800;letter-spacing:2px;color:var(--text)}main{max-width:560px;margin:auto;padding:28px 16px 180px}.page{animation:fade .14s ease-out}.card{background:var(--card);border:1px solid color-mix(in srgb,var(--text) 10%,transparent);border-radius:18px;padding:18px;margin:12px 0}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.grow{flex:1;min-width:0}.stack{display:grid;gap:10px}.session-open{text-align:left;width:100%;border:0;padding:4px 0 16px;font-size:22px;font-weight:750;display:flex;justify-content:space-between;align-items:center}.session-open span:last-child{color:var(--main)}.actions{display:flex;gap:8px;flex-wrap:wrap}.actions button{flex:1}.outline{width:100%;border-style:dashed;background:transparent}.nav{position:fixed;bottom:0;left:0;right:0;background:var(--card);border-top:1px solid color-mix(in srgb,var(--text) 12%,transparent);padding:8px 12px calc(8px + env(safe-area-inset-bottom));z-index:10;display:flex;justify-content:center;gap:8px}.nav button{border:0;background:transparent;width:min(30%,170px);font-weight:700}.nav button.active{color:var(--text);box-shadow:inset 0 -3px var(--main);background:color-mix(in srgb,var(--main) 10%,var(--card))}.nav svg{display:block;width:21px;height:21px;margin:0 auto 3px;fill:none;stroke:currentColor;stroke-width:1.8}.copybar{position:fixed;bottom:calc(85px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:min(528px,calc(100% - 32px));z-index:8}.copybar button{width:100%;min-height:54px;box-shadow:0 5px 22px #0002}.columns,.stockrow{display:grid;grid-template-columns:minmax(0,1fr) 40px 132px 48px;gap:5px;align-items:center}.columns{font-size:11px;opacity:.7;text-align:center;padding:0 8px;margin-top:20px}.columns span:first-child{text-align:left}.stockrow{padding:13px 8px;background:var(--card);border-bottom:1px solid color-mix(in srgb,var(--text) 10%,transparent);transition:background-color .2s}.stockrow:first-child{border-radius:14px 14px 0 0}.stockrow:last-child{border-radius:0 0 14px 14px;border-bottom:0}.stockrow.needed{background:var(--highlight)}.itemname{font-size:14px;font-weight:650;overflow-wrap:anywhere;line-height:1.4}.maximum,.qty{text-align:center;font-variant-numeric:tabular-nums}.qty{font-size:20px;font-weight:800}.stepper{display:grid;grid-template-columns:44px 44px 44px;align-items:center}.stepper button{padding:0;width:44px;height:46px;font-size:23px;border-radius:10px}.stepper input{width:44px;min-width:0;padding:0;text-align:center;height:44px;border:0;background:transparent;font-size:18px;font-weight:750;border-radius:6px}.manual{width:48px;height:46px;padding:0;text-align:center;border:1px solid color-mix(in srgb,var(--text) 25%,transparent);border-radius:9px;background:var(--card);font-weight:750}.kindnote{grid-column:3;text-align:center;font-size:12px;opacity:.75}.pop{animation:pop .14s ease-out}input[type=number]{appearance:textfield;-moz-appearance:textfield}input::-webkit-inner-spin-button,input::-webkit-outer-spin-button{-webkit-appearance:none;margin:0}.field{display:grid;gap:6px;margin:14px 0}.field input,.field select,textarea{background:var(--card);border:1px solid color-mix(in srgb,var(--text) 25%,transparent);border-radius:10px;padding:12px;width:100%;min-height:48px}textarea{resize:vertical;min-height:140px}.themes{display:flex;gap:6px;justify-content:space-between}.theme{padding:8px 2px;border:2px solid transparent;background:transparent;flex:1;font-size:11px}.theme.selected{border-color:var(--main)}.swatch{width:32px;height:32px;border-radius:50%;display:block;margin:0 auto 7px;border:1px solid #8885}.listitem{padding:12px 0;border-bottom:1px solid color-mix(in srgb,var(--text) 12%,transparent)}.listitem:last-child{border:0}.move{padding:0;width:44px;flex-shrink:0}.manage-name{font-weight:700;overflow-wrap:anywhere}.toast{position:fixed;bottom:calc(150px + env(safe-area-inset-bottom));left:50%;transform:translate(-50%,15px);padding:12px 22px;border-radius:14px;background:var(--text);color:var(--bg);opacity:0;transition:opacity .15s,transform .15s;pointer-events:none;z-index:100;max-width:90%;text-align:center}.toast.show{opacity:1;transform:translate(-50%,0)}dialog{width:min(500px,calc(100% - 24px));max-height:85dvh;overflow:auto;border:0;border-radius:20px;background:var(--bg);color:var(--text);padding:22px}dialog::backdrop{background:#0008}.error{color:#b42318;background:#fff0eb;border-radius:10px;padding:12px;margin:12px 0}.empty{padding:30px 12px;text-align:center;opacity:.7}.storage-error{padding:12px;background:#fff0eb;color:#8b2117;font-size:13px}.tag{display:inline-block;font-size:11px;padding:2px 6px;border-radius:6px;background:color-mix(in srgb,var(--text) 7%,var(--card));margin-top:3px}@keyframes fade{from{opacity:.3}to{opacity:1}}@keyframes pop{50%{transform:scale(1.16)}}@media(max-width:350px){main{padding-left:10px;padding-right:10px}.columns,.stockrow{grid-template-columns:minmax(0,1fr) 30px 132px 44px;gap:3px}.itemname{font-size:12px}.manual{width:44px}}@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.drag-name{display:flex;flex-wrap:wrap;align-items:center;gap:2px}.drag-name>span{flex:1;min-width:48px}.drag-handle{width:44px;height:44px;min-width:44px;flex-shrink:0;padding:10px;border:0;background:transparent;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}.drag-handle svg{width:22px;height:22px;display:block;stroke:currentColor;stroke-width:2;fill:none}.drag-handle:active{cursor:grabbing}.drag-placeholder{opacity:.25;outline:2px dashed var(--main);outline-offset:-2px}.drag-ghost{position:fixed!important;z-index:90;pointer-events:none;box-shadow:0 8px 26px #0004;border-radius:14px!important;opacity:.96;outline:2px solid var(--main);transition:none!important;will-change:top}.sorting{user-select:none;-webkit-user-select:none;overscroll-behavior:none}.sorting .copybar{opacity:.3;pointer-events:none}[data-sort-category]{min-height:18px}.sorting [data-sort-category]:empty{min-height:65px;border:2px dashed var(--main);border-radius:12px}
</style></head><body><div id="storageWarning" role="alert"></div><main id="app"></main><nav class="nav" aria-label="하단 탭"></nav><div id="copybar" class="copybar"></div><div id="toast" class="toast" role="status" aria-live="polite"></div><dialog id="editor"></dialog><script>
'use strict';
const KEY='bakery-simple-order-v1';
const THEMES=[['기본 화이트','#F7F7F5','#FFFFFF','#1F1F1F','#2F6FEB','#FFE8A3'],['크림 베이커리','#FBF6EE','#FFFFFF','#3B2A1E','#B5651D','#F6D7B0'],['민트','#F1F8F5','#FFFFFF','#1C2B26','#1D9E75','#C9F0DF'],['라벤더','#F5F4FD','#FFFFFF','#24213A','#6A5ACD','#E3DEFF'],['다크','#161616','#242424','#F0F0F0','#5B9BFF','#4A3B12']];
const seeds=[['가루','강력:21/12,중력:1/1,강력쌀가루:1/1,크라프트:1/1,타피오카T:1/1,참찰빵믹스:1/1,홍국쌀가루:1/1'],['당·유지','원당:21/12,콤파운드:9/4,앵커버터:21/11,분유:8/5,꽃소금:1/1,쇼트닝:1/1,크리미비트:1/1'],['이스트·개량제','생이스트:23/13,건이스트 골드:7/6,건이스트 레드:1/1,엔지마티코:10/7,크리스탈:6/6,코코아파우더:1/1,먹물:1/1'],['부재료','호두반태:3/2,올리브:1/1,올리브유:1/1,알밤:4/2,옥수수캔:4/2,롤치즈:1/1,트리플섹:1/1'],['토핑·포장','오뗄베이컨:3/1,매콤피자소세지:3/1,청정원소세지:4/2,슬라이스햄:2/1,마요네즈1kg:2/1,핀란드머핀컵:1/1,옥수수분말:1/1'],['상비','아몬드슬라이스:1/1,전분:1/1,에멘탈치즈:1/1,딸기잼:1/1,에프리코트혼당:1/1,케찹스파우트:1/1,허니머스타드:1/1'],['고정','목장갑:3/0,니트닐S:1/0'],['눈확인','초코칩:0/0,피스타치오:0/0,호두분태:0/0,마요네즈3kg:0/0,화인휘프:0/0,파슬리:0/0,펄솔트:0/0']];
function initial(){return {version:1,theme:0,sessions:[{id:'wed',name:'수요일 발주'},{id:'sun',name:'일요일 발주'}],categories:seeds.map((c,n)=>({id:'c'+n,name:c[0]})),items:seeds.flatMap((c,n)=>c[1].split(',').map((s,j)=>{const [name,v]=s.split(':');const [a,b]=v.split('/').map(Number);return {id:'i'+n+'_'+j,name,categoryId:'c'+n,type:n===6?'fixed':n===7?'visual':'normal',limits:{wed:a,sun:b},stocks:{wed:0,sun:0},orders:{wed:0,sun:0}}}))};}
const validNumber=n=>typeof n==='number'&&Number.isFinite(n)&&n>=0&&n<=999999&&Math.abs(Math.round(n*1000)-n*1000)<0.000001;
function validate(d){const fail=()=>{throw Error('백업 형식이 올바르지 않습니다. 기존 데이터는 변경되지 않았습니다.');};const obj=x=>x&&typeof x==='object'&&!Array.isArray(x);const id=x=>typeof x==='string'&&/^[a-zA-Z0-9_-]{1,80}$/.test(x)&&!['__proto__','constructor','prototype'].includes(x);const name=x=>typeof x==='string'&&x.trim().length>0&&x.length<=100&&!/[\r\n]/.test(x);if(!obj(d)||![1,2].includes(d.version)||!Number.isInteger(d.theme)||!THEMES[d.theme]||!Array.isArray(d.sessions)||!Array.isArray(d.categories)||!Array.isArray(d.items)||d.sessions.length>100||d.categories.length>200||d.items.length>5000)fail();for(const arr of [d.sessions,d.categories,d.items]){const ids=new Set();for(const x of arr){if(!obj(x)||!id(x.id)||!name(x.name)||ids.has(x.id))fail();ids.add(x.id);}}const cats=new Set(d.categories.map(x=>x.id));for(const i of d.items){if(!cats.has(i.categoryId)||(d.version===1&&!['normal','fixed','visual'].includes(i.type)))fail();for(const k of (d.version===1?['limits','stocks','orders']:['limits','stocks'])){if(!obj(i[k]))fail();for(const s of d.sessions)if(!Object.hasOwn(i[k],s.id)||!validNumber(i[k][s.id]))fail();}}return normalize({version:d.version,theme:d.theme,sessions:d.sessions.map(({id,name})=>({id,name})),categories:d.categories.map(({id,name})=>({id,name})),items:d.items.map(i=>({id:i.id,name:i.name,categoryId:i.categoryId,type:i.type,...Object.fromEntries((d.version===1?['limits','stocks','orders']:['limits','stocks']).map(k=>[k,Object.fromEntries(d.sessions.map(s=>[s.id,i[k][s.id]]))]))}))});}
function normalize(d){
 const legacy=d.version===1;
 if(legacy){
  const removed=new Set(d.categories.filter(c=>['고정','눈확인'].includes(c.name)).map(c=>c.id));
  if(removed.size){let other=d.categories.find(c=>c.name==='기타');if(!other){let id='misc';while(d.categories.some(c=>c.id===id))id+='x';other={id,name:'기타'};d.categories.push(other);}d.items.forEach(i=>{if(removed.has(i.categoryId))i.categoryId=other.id;});d.categories=d.categories.filter(c=>!removed.has(c.id));}
 }
 d.items=d.items.map(i=>{const limits={...i.limits},stocks={...i.stocks};if(legacy&&i.type==='visual')for(const session of d.sessions){limits[session.id]=i.orders[session.id];stocks[session.id]=0;}return {id:i.id,name:i.name,categoryId:i.categoryId,limits,stocks};});
 d.version=2;return d;
}

let data=normalize(initial()),page='home',sid=null,toastTimer,loadError=false;
try{const raw=localStorage.getItem(KEY);if(raw)data=validate(JSON.parse(raw));}catch(e){loadError=true;document.getElementById('storageWarning').className='storage-error';document.getElementById('storageWarning').textContent='저장 데이터를 읽을 수 없습니다. 설정에서 백업을 가져오세요. 기존 저장값을 보호하기 위해 자동 저장을 멈췄습니다.';}
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=> 'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,9);
function persist(){if(loadError)return false;try{localStorage.setItem(KEY,JSON.stringify(data));document.getElementById('storageWarning').textContent='';return true;}catch(e){const el=document.getElementById('storageWarning');el.className='storage-error';el.textContent='브라우저 저장이 차단되었거나 용량이 부족합니다. 설정에서 JSON 백업을 내려받으세요.';return false;}}
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>el.classList.remove('show'),1500);}
function luminance(hex){const c=hex.slice(1).match(/../g).map(v=>parseInt(v,16)/255).map(v=>v<=.04045?v/12.92:((v+.055)/1.055)**2.4);return c[0]*.2126+c[1]*.7152+c[2]*.0722;}
function applyTheme(){const t=THEMES[data.theme];['bg','card','text','main','highlight'].forEach((k,n)=>document.documentElement.style.setProperty('--'+k,t[n+1]));document.documentElement.style.setProperty('--on-main',luminance(t[4])>.179?'#000000':'#FFFFFF');document.documentElement.style.colorScheme=data.theme===4?'dark':'light';}
function amount(i,s=sid){return Math.max(0,Math.round((i.limits[s]-i.stocks[s])*1000)/1000);}

function grouped(){return data.categories.map(c=>({c,items:data.items.filter(i=>i.categoryId===c.id)}));}
function orderText(now=new Date()){const date=new Intl.DateTimeFormat('ko-KR',{timeZone:'Asia/Seoul',month:'numeric',day:'numeric',weekday:'short'}).formatToParts(now);const part=k=>date.find(p=>p.type===k).value;const lines=[`발주 ${part('month')}/${part('day')}(${part('weekday')})`];for(const i of data.items){const q=amount(i);if(q>=1)lines.push(i.name+' '+q);}return lines.join('\n');}

function numberInput(value,attrs=''){return `<input type="number" inputmode="decimal" min="0" max="999999" step="0.001" value="${value}" ${attrs}>`;}
function stockRow(i){const q=amount(i);return `<div class="stockrow ${q>=1?'needed':''}" data-row="${i.id}"><div class="itemname drag-name"><button class="drag-handle" data-drag="${i.id}" aria-label="${esc(i.name)} 순서 이동" title="누른 채 위아래로 끌기 · 키보드 ↑↓"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6h18 M3 12h18 M3 18h18"/></svg></button><span>${esc(i.name)}</span></div><div class="maximum">${i.limits[sid]}</div><div class="stepper"><button data-action="step" data-id="${i.id}" data-delta="-1" aria-label="${esc(i.name)} 재고 1 빼기">−</button>${numberInput(i.stocks[sid],`data-stock="${i.id}" aria-label="${esc(i.name)} 현재 재고"`)}<button data-action="step" data-id="${i.id}" data-delta="1" aria-label="${esc(i.name)} 재고 1 더하기">+</button></div><div class="qty" data-qty>${q}</div></div>`;}

function render(){applyTheme();const app=document.getElementById('app');document.getElementById('copybar').innerHTML='';let html='';if(page==='home'){html=`<div class="eyebrow">BAKERY ORDER</div><h1>빵집 발주</h1><p class="muted">맥시멈 − 현재 재고 = 발주량</p>${data.sessions.map((s,n)=>`<section class="card"><button class="session-open" data-action="open" data-id="${s.id}"><span>${esc(s.name)}</span><span aria-hidden="true">↗</span></button><div class="small muted" style="margin-bottom:12px">${data.items.length}개 품목 · 재고 세기</div><div class="actions"><button data-action="rename-session" data-id="${s.id}">이름 수정</button><button data-action="delete-session" data-id="${s.id}">삭제</button></div></section>`).join('')}<button class="outline" data-action="add-session">＋ 회차 추가</button><p class="small muted" style="margin-top:22px">재고는 회차별로 자동 저장돼요.</p>`;}else if(page==='stock'){const s=data.sessions.find(s=>s.id===sid);if(!s){page='home';return render();}html=`<div class="row between"><button data-action="home">← 홈</button><button data-action="reset">재고 초기화</button></div><h1 style="margin-top:22px">${esc(s.name)}</h1><p class="muted small">재고만 세면 발주량이 바로 계산돼요.<br>≡를 누른 채 끌어서 순서 변경 · 화면 끝에서 자동 스크롤</p><div class="columns"><span>품목명</span><span>맥시멈</span><span>현재 재고</span><span>발주량</span></div><div data-sort-category="all" style="margin-top:12px">${data.items.map(stockRow).join('')||'<div class="empty">품목 관리에서 품목을 추가하세요.</div>'}</div>`;document.getElementById('copybar').innerHTML='<button class="primary" data-action="copy-order">카톡 복사</button>';}else if(page==='items'){html=`<div class="eyebrow">ITEMS</div><h1>품목 관리</h1><p class="muted">품목과 회차별 기준 수량을 관리해요.</p><div class="actions"><button class="primary" data-action="edit-item">＋ 품목 추가</button><button data-action="categories">카테고리 관리</button></div>${grouped().map(g=>`<section class="card"><h2>${esc(g.c.name)} <span class="muted small">${g.items.length}</span></h2>${g.items.map((i,n)=>`<div class="listitem"><div class="row"><div class="grow"><div class="manage-name">${esc(i.name)}</div></div><button class="move" data-action="move" data-id="${i.id}" data-delta="-1" aria-label="${esc(i.name)} 위로" ${n===0?'disabled':''}>↑</button><button class="move" data-action="move" data-id="${i.id}" data-delta="1" aria-label="${esc(i.name)} 아래로" ${n===g.items.length-1?'disabled':''}>↓</button><button data-action="edit-item" data-id="${i.id}">수정</button></div></div>`).join('')||'<div class="small muted">등록된 품목이 없어요.</div>'}</section>`).join('')}`;}else{html=`<div class="eyebrow">SETTINGS</div><h1>설정</h1><section class="card"><h2>색상 테마</h2><div class="themes">${THEMES.map((t,n)=>`<button class="theme ${data.theme===n?'selected':''}" data-action="theme" data-id="${n}" aria-pressed="${data.theme===n}"><span class="swatch" style="background:${t[4]}"></span>${t[0]}${data.theme===n?' ✓':''}</button>`).join('')}</div></section><section class="card"><h2>백업 내보내기</h2><p class="small muted">회차, 품목, 기준 수량, 현재 재고, 품목 순서와 테마를 함께 저장해요.</p><div class="stack"><button class="primary" data-action="export">JSON 파일 다운로드</button><button data-action="copy-backup">백업 텍스트 복사</button></div></section><section class="card"><h2>백업 가져오기</h2><p class="small muted">파일을 선택하거나 백업 텍스트를 붙여넣으세요.</p><label class="field">JSON 파일<input id="importFile" type="file" accept=".json,application/json"></label><label class="field">백업 텍스트<textarea id="importText" placeholder="JSON 백업 내용을 여기에 붙여넣기" spellcheck="false"></textarea></label><button data-action="import-text" style="width:100%">텍스트로 가져오기</button><div id="importError" role="alert"></div></section><p class="small muted">이 브라우저에 저장됩니다. 브라우저 데이터를 지우거나 다른 기기로 옮기기 전에는 백업하세요.</p>`;}
app.innerHTML='<div class="page">'+html+'</div>';const icons={home:'<path d="M3 10 12 3l9 7v11H3Z M9 21v-8h6v8"/>',items:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 3h6v4H9Z M8 11h8 M8 15h8"/>',settings:'<circle cx="12" cy="12" r="4"/><path d="M12 2v3 M12 19v3 M2 12h3 M19 12h3 M5 5l2 2 M17 17l2 2 M5 19l2-2 M17 7l2-2"/>'};document.querySelector('.nav').innerHTML=[['home','홈'],['items','품목 관리'],['settings','설정']].map(([p,n])=>`<button data-action="tab" data-id="${p}" class="${page===p||(page==='stock'&&p==='home')?'active':''}" ${page===p?'aria-current="page"':''}><svg viewBox="0 0 24 24" aria-hidden="true">${icons[p]}</svg>${n}</button>`).join('');}
function showDialog(html){const el=document.getElementById('editor');el.innerHTML=html;if(!el.open)el.showModal();}
function closeDialog(){document.getElementById('editor').close();}
function editItem(id){if(!data.categories.length){toast('먼저 카테고리를 추가하세요');return categoryDialog();}const i=data.items.find(i=>i.id===id);showDialog(`<form id="itemForm" data-id="${id||''}"><h2>${i?'품목 수정':'품목 추가'}</h2><label class="field">품목명<input name="name" required maxlength="100" value="${esc(i?.name||'')}"></label><label class="field">카테고리<select name="categoryId">${data.categories.map(c=>`<option value="${c.id}" ${i?.categoryId===c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label><div id="limitsFields">${data.sessions.map(s=>`<label class="field">${esc(s.name)} <span class="limitLabel">맥시멈</span>${numberInput(i?.limits[s.id]||0,`name="limit-${s.id}" required`)}</label>`).join('')}</div><div class="actions"><button type="button" data-action="close">취소</button><button class="primary" type="submit">저장</button></div>${i?`<button type="button" data-action="delete-item" data-id="${id}" class="outline" style="margin-top:14px">품목 삭제</button>`:''}</form>`);}

function categoryDialog(){showDialog(`<h2>카테고리 관리</h2>${data.categories.map(c=>`<div class="listitem row"><span class="grow">${esc(c.name)}</span><button data-action="rename-category" data-id="${c.id}">수정</button><button data-action="delete-category" data-id="${c.id}">삭제</button></div>`).join('')}<div class="stack" style="margin-top:16px"><button data-action="add-category">＋ 카테고리 추가</button><button class="primary" data-action="close">닫기</button></div><p class="small muted" style="margin:16px 0 0">품목이 있는 카테고리는 품목을 옮기거나 삭제한 뒤 지울 수 있어요.</p>`);}
function askName(message,current=''){const v=prompt(message,current);if(v===null)return null;const s=v.trim();if(!s||s.length>100||/[\r\n]/.test(s)){toast('이름을 1~100자로 입력하세요');return null;}return s;}
async function copyText(text){try{if(navigator.clipboard&&window.isSecureContext){try{await navigator.clipboard.writeText(text);toast('복사됨');return;}catch(e){}}const t=document.createElement('textarea');t.value=text;t.style.cssText='position:fixed;top:0;left:0;width:1px;height:1px;opacity:.01';document.body.appendChild(t);t.focus();t.select();t.setSelectionRange(0,text.length);let ok=false;try{ok=document.execCommand('copy');}finally{t.remove();}if(!ok)throw Error();toast('복사됨');}catch(e){showDialog('<h2>텍스트 복사</h2><p class="small">브라우저가 자동 복사를 허용하지 않았어요. 아래 내용을 길게 눌러 복사하세요.</p><textarea id="manualCopy" readonly></textarea><button data-action="close" style="width:100%;margin-top:12px">닫기</button>');const t=document.getElementById('manualCopy');t.value=text;t.focus();t.select();}}
function patchStock(i,pop=false){const row=document.querySelector(`[data-row="${i.id}"]`);const q=amount(i);row.classList.toggle('needed',q>=1);const qty=row.querySelector('[data-qty]');if(qty)qty.textContent=q;if(pop){const input=row.querySelector('[data-stock]');input.value=i.stocks[sid];input.classList.remove('pop');void input.offsetWidth;input.classList.add('pop');}}
function parseNum(v){if(v.trim()==='')return 0;const n=Number(v);return validNumber(n)?n:null;}
function importBackup(text){const error=document.getElementById('importError');try{const next=validate(JSON.parse(text));if(!confirm('현재 데이터를 덮어씁니다. 가져오시겠습니까?'))return;try{localStorage.setItem(KEY,JSON.stringify(next));}catch(e){throw Error('브라우저에 저장할 수 없어 가져오기를 취소했습니다. 기존 데이터는 유지됩니다.');}data=next;loadError=false;sid=null;document.getElementById('storageWarning').textContent='';render();toast('가져오기 완료');}catch(e){error.className='error';error.textContent=e instanceof SyntaxError?'올바른 JSON 파일이 아닙니다. 기존 데이터는 변경되지 않았습니다.':e.message;}}
document.addEventListener('input',e=>{const stock=e.target.dataset.stock,order=e.target.dataset.order;if(!stock&&!order)return;const i=data.items.find(i=>i.id===(stock||order)),n=parseNum(e.target.value);e.target.setCustomValidity(n===null?'0~999999 숫자, 소수점 셋째 자리까지 입력하세요':'');if(n===null)return;i[stock?'stocks':'orders'][sid]=n;persist();patchStock(i);});
document.addEventListener('focusout',e=>{if(e.target.dataset.stock||e.target.dataset.order){const i=data.items.find(i=>i.id===(e.target.dataset.stock||e.target.dataset.order));e.target.value=i[e.target.dataset.stock?'stocks':'orders'][sid];e.target.setCustomValidity('');}});
document.addEventListener('change',async e=>{if(e.target.id==='importFile'&&e.target.files[0]){const f=e.target.files[0];if(f.size>10000000){document.getElementById('importError').textContent='파일이 너무 큽니다. 10MB 이하의 JSON을 선택하세요.';return;}try{importBackup(await f.text());}catch(err){document.getElementById('importError').textContent='파일을 읽을 수 없습니다.';}e.target.value='';}});
document.addEventListener('submit',e=>{if(e.target.id!=='itemForm')return;e.preventDefault();const f=e.target,id=f.dataset.id,fd=new FormData(f),name=fd.get('name').trim();if(!name||/[\r\n]/.test(name))return toast('품목명을 입력하세요');const old=data.items.find(i=>i.id===id);const i=old?JSON.parse(JSON.stringify(old)):{id:uid(),limits:{},stocks:{}};i.name=name;i.categoryId=fd.get('categoryId');for(const s of data.sessions){const n=parseNum(fd.get('limit-'+s.id));if(n===null)return toast('기준 수량을 확인하세요');i.limits[s.id]=n;i.stocks[s.id]??=0;}if(old)data.items[data.items.indexOf(old)]=i;else data.items.push(i);persist();closeDialog();render();toast('저장됨');});
document.addEventListener('click',async e=>{const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action,id=b.dataset.id;if(a==='step'){const i=data.items.find(i=>i.id===id);i.stocks[sid]=Math.max(0,Math.min(999999,Math.round((i.stocks[sid]+Number(b.dataset.delta))*1000)/1000));persist();patchStock(i,true);return;}if(a==='close')return closeDialog();if(a==='tab'||a==='home'){page=a==='home'?'home':id;render();window.scrollTo(0,0);return;}if(a==='open'){sid=id;page='stock';render();window.scrollTo(0,0);return;}if(a==='theme'){data.theme=Number(id);persist();render();return;}if(a==='copy-order')return copyText(orderText());if(a==='copy-backup')return copyText(JSON.stringify(data,null,2));if(a==='export'){const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));const link=document.createElement('a');link.href=url;link.download='빵집발주-백업-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);return;}if(a==='import-text')return importBackup(document.getElementById('importText').value);if(a==='edit-item')return editItem(id);if(a==='categories')return categoryDialog();if(a==='reset'){if(!confirm('이 회차의 현재 재고를 모두 0으로 초기화할까요?'))return;for(const i of data.items){i.stocks[sid]=0;}}if(a==='add-session'){const name=askName('새 회차 이름');if(!name)return;const id=uid();data.sessions.push({id,name});for(const i of data.items)for(const k of ['limits','stocks'])i[k][id]=0;}if(a==='rename-session'){const s=data.sessions.find(s=>s.id===id),name=askName('회차 이름 수정',s.name);if(!name)return;s.name=name;}if(a==='delete-session'){if(!confirm('이 회차와 해당 회차의 기준 수량·재고를 삭제할까요?'))return;data.sessions=data.sessions.filter(s=>s.id!==id);for(const i of data.items)for(const k of ['limits','stocks'])delete i[k][id];}if(a==='delete-item'){if(!confirm('이 품목을 모든 회차에서 삭제할까요?'))return;data.items=data.items.filter(i=>i.id!==id);closeDialog();}if(a==='move'){const i=data.items.find(i=>i.id===id),list=data.items.filter(x=>x.categoryId===i.categoryId),other=list[list.indexOf(i)+Number(b.dataset.delta)];if(!other)return;const x=data.items.indexOf(i),y=data.items.indexOf(other);[data.items[x],data.items[y]]=[data.items[y],data.items[x]];}if(a==='add-category'){const name=askName('새 카테고리 이름');if(!name)return;data.categories.push({id:uid(),name});}if(a==='rename-category'){const c=data.categories.find(c=>c.id===id),name=askName('카테고리 이름 수정',c.name);if(!name)return;c.name=name;}if(a==='delete-category'){if(data.items.some(i=>i.categoryId===id))return toast('품목을 먼저 옮기거나 삭제하세요');if(!confirm('이 카테고리를 삭제할까요?'))return;data.categories=data.categories.filter(c=>c.id!==id);}persist();render();if(a.endsWith('category'))categoryDialog();});

// Pointer-based sorting keeps native scrolling everywhere except the grab handle.
let drag=null,dragFrame=0,suppressHandleClickUntil=0;
function commitVisibleOrder(){
 const byId=new Map(data.items.map(i=>[i.id,i]));const ordered=[];
 document.querySelectorAll('[data-sort-category]').forEach(group=>{
  group.querySelectorAll('[data-row]').forEach(row=>{const item=byId.get(row.dataset.row);if(item){ordered.push(item);byId.delete(item.id);}});
 });
 if(ordered.length===data.items.length){data.items=ordered;return persist();}return false;
}
function placeDragged(){
 if(!drag||!drag.active)return;
 const groups=[...document.querySelectorAll('[data-sort-category]')];if(!groups.length)return;
 let group=groups[0],distance=Infinity;
 for(const g of groups){const r=g.getBoundingClientRect();const d=drag.y<r.top?r.top-drag.y:drag.y>r.bottom?drag.y-r.bottom:0;if(d<distance){distance=d;group=g;}}
 const siblings=[...group.querySelectorAll('[data-row]')].filter(r=>r!==drag.row);
 const next=siblings.find(r=>{const rect=r.getBoundingClientRect();return drag.y<rect.top+rect.height/2;});
 if(next){if(drag.row.parentElement!==group||drag.row.nextElementSibling!==next)group.insertBefore(drag.row,next);}
 else if(drag.row.parentElement!==group||drag.row.nextElementSibling)group.appendChild(drag.row);
}
function scrollDrag(time){
 if(!drag)return;
 const elapsed=Math.min(32,time-(drag.time||time));drag.time=time;
 if(drag.active){
 const nav=document.querySelector('.nav').getBoundingClientRect();
 const bottom=Math.min(window.innerHeight,nav.top)-12,top=24,edge=88;
 const speed=drag.y<top+edge?-Math.min(1,(top+edge-drag.y)/edge):drag.y>bottom-edge?Math.min(1,(drag.y-(bottom-edge))/edge):0;
 if(speed)window.scrollBy(0,speed*elapsed*.75);
 drag.ghost.style.top=(drag.y-drag.offset)+'px';placeDragged();
 }
 dragFrame=requestAnimationFrame(scrollDrag);
}
function finishDrag(cancel=false){
 if(!drag)return;const d=drag;drag=null;cancelAnimationFrame(dragFrame);
 if(d.active){
 if(cancel){if(d.originalNext&&d.originalNext.parentElement===d.originalParent)d.originalParent.insertBefore(d.row,d.originalNext);else d.originalParent.appendChild(d.row);}
 else {const saved=commitVisibleOrder();toast(saved?'순서 저장됨':'순서 변경됨 · 저장 상태를 확인하세요');}
 d.ghost.remove();d.row.classList.remove('drag-placeholder');suppressHandleClickUntil=Date.now()+350;
 }
 document.body.classList.remove('sorting');
 if(d.capture.hasPointerCapture?.(d.pointerId))d.capture.releasePointerCapture(d.pointerId);
}
document.addEventListener('pointerdown',e=>{
 const handle=e.target.closest('[data-drag]');if(!handle||drag||e.button!==0||e.isPrimary===false)return;
 const row=handle.closest('[data-row]');const rect=row.getBoundingClientRect();
 drag={handle,row,capture:document.getElementById('app'),pointerId:e.pointerId,startY:e.clientY,y:e.clientY,offset:e.clientY-rect.top,originalParent:row.parentElement,originalNext:row.nextElementSibling,active:false};
 drag.capture.setPointerCapture(e.pointerId);dragFrame=requestAnimationFrame(scrollDrag);
});
document.addEventListener('pointermove',e=>{
 if(!drag||e.pointerId!==drag.pointerId)return;drag.y=e.clientY;
 if(!drag.active&&Math.abs(drag.y-drag.startY)>=5){
 const rect=drag.row.getBoundingClientRect();drag.active=true;drag.ghost=drag.row.cloneNode(true);drag.ghost.removeAttribute('data-row');drag.ghost.classList.add('drag-ghost');drag.ghost.setAttribute('aria-hidden','true');drag.ghost.inert=true;drag.ghost.style.width=rect.width+'px';drag.ghost.style.left=rect.left+'px';drag.ghost.style.top=(drag.y-drag.offset)+'px';document.body.appendChild(drag.ghost);drag.row.classList.add('drag-placeholder');document.body.classList.add('sorting');
 }
 if(drag.active){e.preventDefault();drag.ghost.style.top=(drag.y-drag.offset)+'px';placeDragged();}
},{passive:false});
document.addEventListener('pointerup',e=>{if(drag&&e.pointerId===drag.pointerId)finishDrag();});
document.addEventListener('pointercancel',e=>{if(drag&&e.pointerId===drag.pointerId)finishDrag(true);});
document.addEventListener('lostpointercapture',e=>{if(drag&&e.pointerId===drag.pointerId)finishDrag(true);});
window.addEventListener('blur',()=>finishDrag(true));
document.addEventListener('visibilitychange',()=>{if(document.hidden)finishDrag(true);});
document.addEventListener('click',e=>{if(e.target.closest('[data-drag]')){e.preventDefault();e.stopImmediatePropagation();if(Date.now()>suppressHandleClickUntil)toast('≡를 누른 채 위아래로 끌어주세요');}},true);
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'&&drag){finishDrag(true);return;}
 const h=e.target.closest('[data-drag]');if(!h||!['ArrowUp','ArrowDown'].includes(e.key))return;e.preventDefault();
 const row=h.closest('[data-row]'),rows=[...document.querySelectorAll('[data-sort-category] [data-row]')],n=rows.indexOf(row),other=rows[n+(e.key==='ArrowUp'?-1:1)];if(!other)return;
 other.parentElement.insertBefore(row,e.key==='ArrowUp'?other:other.nextElementSibling);commitVisibleOrder();h.focus();row.scrollIntoView({block:'nearest'});toast('순서 저장됨');
});

applyTheme();render();if(!loadError)persist();
</script></body></html>
